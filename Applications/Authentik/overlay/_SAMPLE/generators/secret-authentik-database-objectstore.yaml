---
apiVersion: builtin
kind: SecretGenerator
metadata:
  name: authentik-database-objectstore
behavior: create
options:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/component: 'database'
  annotations:
    reloader.stakater.com/match: 'false'
    reloader.stakater.com/ignore: 'true'
type: Opaque
envs:
  - ./secrets/secret-authentik-database-objectstore.env
