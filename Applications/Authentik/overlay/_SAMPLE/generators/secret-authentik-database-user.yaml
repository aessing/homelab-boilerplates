---
apiVersion: builtin
kind: SecretGenerator
metadata:
  name: authentik-database-user
behavior: create
options:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/component: 'database'
    cnpg.io/reload: "true"
  annotations:
    reloader.stakater.com/match: 'true'
    reloader.stakater.com/ignore: 'false'
type: kubernetes.io/basic-auth
envs:
  - ./secrets/secret-authentik-database-user.env
