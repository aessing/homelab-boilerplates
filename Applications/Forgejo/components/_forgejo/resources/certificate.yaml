---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: forgejo
  labels:
    app.kubernetes.io/component: 'application'
  annotations:
    reloader.stakater.com/match: 'false'  # Marks the config/secret as eligible for reload in search mode
spec:
  secretName: forgejo-certificate
  secretTemplate:
    labels:
      app.kubernetes.io/component: 'application'  # The component within the architecture
    annotations:
      reloader.stakater.com/match: 'true'  # Marks the config/secret as eligible for reload in search mode
  # 90d certificate lifetime
  duration: 2160h
  # 15d renew before cert gets expires
  renewBefore: 360h
  subject:
    organizations:
      - CHANGE_ME
  isCA: false
  privateKey:
    algorithm: ECDSA
    # encoding: PKCS1
    size: 384
    # cert-manager regenerates a new private key on each issuance
    rotationPolicy: Always
  usages:
    - digital signature
    - key encipherment
    - server auth
  # At least one of a DNS Name, URI, or IP address is required.
  dnsNames:
    - CHANGE_ME
  issuerRef:
    name: letsencrypt-production-default
    # We can reference ClusterIssuers by changing the kind here.
    # The default value is Issuer (i.e. a locally namespaced Issuer)
    kind: ClusterIssuer
    # This is optional since cert-manager will default to this value however
    # if you are using an external issuer, change this to that issuer group.
    group: cert-manager.io
