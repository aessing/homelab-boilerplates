---
apiVersion: builtin
kind: SecretGenerator
metadata:
  name: forgejo-database-user
behavior: create
options:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/component: 'database'
  annotations:
    reloader.stakater.com/match: 'true'
    reloader.stakater.com/ignore: 'false'
type: kubernetes.io/basic-auth
envs:
  - ./secrets/secret-forgejo-database-user.env
