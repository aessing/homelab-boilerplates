---
apiVersion: builtin
kind: ReplicaCountTransformer
metadata:
  name: forgejo-replicatransformer
replica:
  name: forgejo
  count: 1
fieldSpecs:
  - path: spec/replicas
    create: true
    kind: Deployment
  - path: spec/replicas
    create: true
    kind: ReplicationController
  - path: spec/replicas
    create: true
    kind: ReplicaSet
  - path: spec/replicas
    create: true
    kind: StatefulSet
---
apiVersion: builtin
kind: ReplicaCountTransformer
metadata:
  name: forgejo-runner-replicatransformer
replica:
  name: forgejo-runner
  count: 1
fieldSpecs:
  - path: spec/replicas
    create: true
    kind: Deployment
  - path: spec/replicas
    create: true
    kind: ReplicationController
  - path: spec/replicas
    create: true
    kind: ReplicaSet
  - path: spec/replicas
    create: true
    kind: StatefulSet
