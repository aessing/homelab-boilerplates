---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-haengine
  labels:
    app.kubernetes.io/component: 'haengine'
spec:
  revisionHistoryLimit: 3
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/component: 'haengine'
    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 999
      containers:
        - name: grafana-haengine
          image: redis:0.0.0
          command: ['redis-server']
          args: ['/conf/redis-full.conf', '--requirepass', '$(REDIS_AUTH)']
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            runAsUser: 999
            runAsGroup: 999
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: false
          resources:
            requests:
              cpu: 0.05
              memory: 32Mi
            limits:
              cpu: 0.2
              memory: 128Mi
          env:
            - name: REDIS_AUTH
              valueFrom:
                secretKeyRef:
                  name: grafana-haengine-auth
                  key: authkey
          ports:
            - containerPort: 6379
              protocol: TCP
              name: redis
          startupProbe:
            exec:
              command: ['redis-cli', 'ping']
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ['redis-cli', 'ping']
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          volumeMounts:
            - name: grafana-haengine-config-vol
              mountPath: /conf/redis.conf
              subPath: redis.conf
              readOnly: true
            - name: grafana-haengine-config-vol
              mountPath: /conf/redis-full.conf
              subPath: redis-full.conf
              readOnly: true
      volumes:
        - name: grafana-haengine-config-vol
          configMap:
            name: grafana-haengine-config
