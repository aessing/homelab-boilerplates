---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-haengine
  labels:
    app.kubernetes.io/component: 'haengine'
  annotations:
    #reloader.stakater.com/auto: 'true' # Reloads workload when any referenced ConfigMap or Secret changes
    reloader.stakater.com/search: 'false' # Enables search mode (only reloads if matching secrets/configMaps are found)
    #configmap.reloader.stakater.com/auto: 'true' # Reloads only when referenced ConfigMap(s) change
    #configmap.reloader.stakater.com/reload: '' # Reloads when specific ConfigMap(s) change, regardless of how they're used
    #secret.reloader.stakater.com/auto: 'true' # Reloads only when referenced Secret(s) change
    #secret.reloader.stakater.com/reload: '' # Reloads when specific Secret(s) change, regardless of how they're used
    reloader.stakater.com/rollout-strategy: 'rollout' # Specifies the rollout strategy for the workload (rollout (default) / restart)
spec:
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/component: 'haengine'
    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: 180
      securityContext:
        fsGroup: 999
      containers:
        - name: grafana-haengine
          image: redis:0.0.0
          command: ['redis-server']
          args: ['/conf/redis-full.conf', '--requirepass', '$(REDIS_AUTH)']
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            runAsUser: 999
            runAsGroup: 999
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: false
          resources:
            requests:
              cpu: 0.25
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1024Mi
          env:
            - name: REDIS_AUTH
              valueFrom:
                secretKeyRef:
                  name: grafana-haengine-auth
                  key: authkey
          ports:
            - containerPort: 6379
              protocol: TCP
              name: redis
          startupProbe:
            exec:
              command: ['redis-cli', 'ping']
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ['redis-cli', 'ping']
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 5
          volumeMounts:
            - name: grafana-haengine-config-vol
              mountPath: /conf/redis.conf
              subPath: redis.conf
              readOnly: true
            - name: grafana-haengine-config-vol
              mountPath: /conf/redis-full.conf
              subPath: redis-full.conf
              readOnly: true
      volumes:
        - name: grafana-haengine-config-vol
          configMap:
            name: grafana-haengine-config
