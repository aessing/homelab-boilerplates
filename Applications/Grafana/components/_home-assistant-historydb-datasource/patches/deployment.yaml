---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  template:
    spec:
      containers:
        - name: grafana
          env:
            - name: HA_HISTORYDB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: grafana-home-assistant-historydb-datasource
                  key: username
            - name: HA_HISTORYDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-home-assistant-historydb-datasource
                  key: password
          volumeMounts:
            - name: home-assistant-historydb-datasource
              mountPath: /etc/grafana/provisioning/datasources/home-assistant-historydb.yaml
              subPath: home-assistant-historydb.yaml
              readOnly: true
      volumes:
        - name: home-assistant-historydb-datasource
          configMap:
            name: grafana-home-assistant-historydb-datasource
