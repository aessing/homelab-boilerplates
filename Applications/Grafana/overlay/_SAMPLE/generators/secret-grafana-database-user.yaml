---
apiVersion: builtin
kind: SecretGenerator
metadata:
  name: grafana-database-user
behavior: create
options:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/component: 'database'
  annotations:
    # Reloads handled by kustomize with suffix
    reloader.stakater.com/match: 'false' # Marks the config/secret as eligible for reload in search mode
type: Opaque
envs:
  - ./secrets/secret-grafana-database-user.env
