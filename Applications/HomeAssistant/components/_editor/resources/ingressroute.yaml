---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: editor
  labels:
    app.kubernetes.io/component: 'editor'
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: CHANGE_ME
      kind: Rule
      middlewares:
        - name: chain-admin
          namespace: traefik-system
      services:
        - name: editor
          port: 8443
          passHostHeader: true
          # sticky:
          #   cookie:
          #     httpOnly: true
          #     secure: true
          #     sameSite: none
  tls:
    secretName: editor-certificate
