---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: homeassistant
  labels:
    app.kubernetes.io/component: 'application'
  annotations:
    #reloader.stakater.com/auto: 'true' # Reloads workload when any referenced ConfigMap or Secret changes
    reloader.stakater.com/search: 'true' # Enables search mode (only reloads if matching secrets/configMaps are found)
    #configmap.reloader.stakater.com/auto: 'true' # Reloads only when referenced ConfigMap(s) change
    #configmap.reloader.stakater.com/reload: '' # Reloads when specific ConfigMap(s) change, regardless of how they're used
    #secret.reloader.stakater.com/auto: 'true' # Reloads only when referenced Secret(s) change
    #secret.reloader.stakater.com/reload: '' # Reloads when specific Secret(s) change, regardless of how they're used
    reloader.stakater.com/rollout-strategy: 'rollout' # Specifies the rollout strategy for the workload (rollout (default) / restart)
spec:
  revisionHistoryLimit: 3
  serviceName: homeassistant
  selector:
    matchLabels:
      app.kubernetes.io/component: 'application'
  replicas: 0
  persistentVolumeClaimRetentionPolicy:
    whenScaled: Retain
    whenDeleted: Retain
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/component: 'application'
      annotations:
        k8s.v1.cni.cncf.io/networks: homeassistant/homeassistant
    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: 180
      initContainers:
        - name: mariadb-wait
          image: busybox:0.0.0
          command: ['/bin/sh', '-c', 'until nc -zw10 recorder 3306 >/dev/null 2>&1; do echo waiting for recorder database; sleep 5; done']
      containers:
        - name: homeassistant
          image: ghcr.io/home-assistant/home-assistant:0.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: false
          resources:
            requests:
              cpu: 1
              memory: 1024Mi
            limits:
              cpu: 2
              memory: 2048Mi
          ports:
            - containerPort: 8123
              protocol: TCP
              name: http
          startupProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          volumeMounts:
            - mountPath: /config
              name: homeassistant-config
            - name: homeassistant-certificate-vol
              mountPath: '/config/certs'
              readOnly: true
      volumes:
        - name: homeassistant-certificate-vol
          secret:
            secretName: homeassistant-certificate
  volumeClaimTemplates:
    - metadata:
        name: homeassistant-config
        labels:
          app.kubernetes.io/component: 'application'
      spec:
        accessModes:
          - ReadWriteMany
        storageClassName: longhorn-retain
        resources:
          requests:
            storage: 0Gi
