---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - ./resources/certificate.yaml
  - ./resources/deployment.yaml
  - ./resources/pvc.yaml
  - ./resources/service.yaml

configMapGenerator:
  - name: mqtt-config
    behavior: create
    options:
      labels:
        app.kubernetes.io/component: 'mqtt'  # The component within the architecture
      annotations:
        # Reloads handled by kustomize with suffix
        reloader.stakater.com/match: 'false'  # Marks the config/secret as eligible for reload in search mode
    files:
      - ./configs/mosquitto.conf
