---
apiVersion: v1
kind: Service
metadata:
  name: mqtt
  labels:
    app.kubernetes.io/component: 'mqtt'
  annotations:
    metallb.io/loadBalancerIPs: 0.0.0.0
spec:
  selector:
    app.kubernetes.io/component: 'mqtt'
  clusterIP: None
  ports:
    - protocol: TCP
      port: 1883
      targetPort: 1883
      name: mqtt
  type: LoadBalancer
