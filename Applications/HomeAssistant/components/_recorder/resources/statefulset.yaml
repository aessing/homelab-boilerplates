---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: recorder
  labels:
    app.kubernetes.io/component: 'recorder'
  annotations:
    #reloader.stakater.com/auto: 'true' # Reloads workload when any referenced ConfigMap or Secret changes
    reloader.stakater.com/search: 'false' # Enables search mode (only reloads if matching secrets/configMaps are found)
    #configmap.reloader.stakater.com/auto: 'true' # Reloads only when referenced ConfigMap(s) change
    #configmap.reloader.stakater.com/reload: '' # Reloads when specific ConfigMap(s) change, regardless of how they're used
    #secret.reloader.stakater.com/auto: 'true' # Reloads only when referenced Secret(s) change
    #secret.reloader.stakater.com/reload: '' # Reloads when specific Secret(s) change, regardless of how they're used
    reloader.stakater.com/rollout-strategy: 'rollout' # Specifies the rollout strategy for the workload (rollout (default) / restart)
spec:
  revisionHistoryLimit: 3
  serviceName: recorder
  selector:
    matchLabels:
      app.kubernetes.io/component: 'recorder'
  replicas: 0
  persistentVolumeClaimRetentionPolicy:
    whenScaled: Retain
    whenDeleted: Retain
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/component: 'recorder'
    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: 180
      securityContext:
        fsGroup: 999
      containers:
        - name: recorder
          image: mariadb:0.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            runAsUser: 999
            runAsGroup: 999
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: false
          resources:
            requests:
              cpu: 0.25
              memory: 1024Mi
            limits:
              cpu: 1
              memory: 2048Mi
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: recorder-root
                  key: password
            - name: MARIADB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: recorder-user
                  key: database
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: recorder-user
                  key: username
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: recorder-user
                  key: password
          ports:
            - containerPort: 3306
              protocol: TCP
              name: mysql
          lifecycle:
            preStop:
              exec:
                command: ['/bin/sh', '-c', 'mysqladmin --protocol=socket --user=root --password=$MARIADB_ROOT_PASSWORD shutdown']
          startupProbe:
            exec:
              command: ['/usr/local/bin/healthcheck.sh', '--connect', '--innodb_initialized']
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ['/usr/local/bin/healthcheck.sh', '--connect', '--innodb_initialized']
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ['/usr/local/bin/healthcheck.sh', '--connect', '--innodb_initialized']
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 5
          volumeMounts:
            - mountPath: /var/lib/mysql
              name: recorder-data
  volumeClaimTemplates:
    - metadata:
        name: recorder-data
        labels:
          app.kubernetes.io/component: 'recorder'
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn-retain
        resources:
          requests:
            storage: 0Gi
