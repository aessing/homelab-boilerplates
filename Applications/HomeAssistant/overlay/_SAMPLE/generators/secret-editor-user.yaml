---
apiVersion: builtin
kind: SecretGenerator
metadata:
  name: editor-user
behavior: create
options:
  labels:
    app.kubernetes.io/component: 'editor'
  annotations:
    # Reloads handled by kustomize with suffix
    reloader.stakater.com/match: 'false'  # Marks the config/secret as eligible for reload in search mode
type: Opaque
envs:
  - ./secrets/secret-editor-user.env
