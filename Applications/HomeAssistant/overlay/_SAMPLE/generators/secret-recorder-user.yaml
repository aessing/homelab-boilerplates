---
apiVersion: builtin
kind: SecretGenerator
metadata:
  name: recorder-user
behavior: create
options:
  labels:
    app.kubernetes.io/component: 'recorder'
  annotations:
    # Reloads handled by kustomize with suffix
    reloader.stakater.com/match: 'false' # Marks the config/secret as eligible for reload in search mode
type: Opaque
envs:
  - ./secrets/secret-recorder-user.env
