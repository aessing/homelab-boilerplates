apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: homeassistant

buildMetadata:
  - managedByLabel
  - originAnnotations
  #- transformerAnnotations

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/version: 2025.11.2 # The current version of the application

resources:
  - ../../base

generators:
  - ./generators/secret-editor-user.yaml
  - ./generators/secret-homeassistant-db-objectstore.yaml
  - ./generators/secret-homeassistant-db-user.yaml
  - ./generators/secret-mqtt-acl.yaml
  - ./generators/secret-mqtt-user.yaml

patches:
  - path: ./patches/certificate-editor.json
    target:
      group: cert-manager.io
      version: v1
      kind: Certificate
      name: editor
  - path: ./patches/certificate-homeassistant.json
    target:
      group: cert-manager.io
      version: v1
      kind: Certificate
      name: homeassistant
  - path: ./patches/certificate-mqtt.json
    target:
      group: cert-manager.io
      version: v1
      kind: Certificate
      name: mqtt
  - path: ./patches/homeassistant-db-objectstore.yaml
    target:
      group: barmancloud.cnpg.io
      version: v1
      kind: ObjectStore
      name: homeassistant-db-objectstore
  - path: ./patches/homeassistant-db-schedule.yaml
    target:
      group: postgresql.cnpg.io
      version: v1
      kind: ScheduledBackup
      name: homeassistant-db-scheduledbackup
  - path: ./patches/homeassistant-db.json
    target:
      group: postgresql.cnpg.io
      version: v1
      kind: Cluster
      name: homeassistant-db
  - path: ./patches/ingressroute-editor.json
    target:
      group: traefik.io
      version: v1alpha1
      kind: IngressRoute
      name: editor
  - path: ./patches/ingressroute-homeassistant.json
    target:
      group: traefik.io
      version: v1alpha1
      kind: IngressRoute
      name: homeassistant
  - path: ./patches/multus-homeassistant.yaml
    target:
      group: k8s.cni.cncf.io
      version: v1
      kind: NetworkAttachmentDefinition
      name: homeassistant
  - path: ./patches/network-policy.json
    target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: kubeproxy-to-cluster
  - path: ./patches/pvc-editor.json
    target:
      group: apps
      version: v1
      kind: StatefulSet
      name: editor
  - path: ./patches/pvc-homeassistant.json
    target:
      group: apps
      version: v1
      kind: StatefulSet
      name: homeassistant
  - path: ./patches/resource-quota.json
    target:
      version: v1
      kind: ResourceQuota
  - path: ./patches/service-mqtt.json
    target:
      version: v1
      kind: Service
      name: mqtt
  - path: ./patches/statefulset-editor.yaml
    target:
      group: apps
      version: v1
      kind: StatefulSet
      name: editor

transformers:
  # https://hub.docker.com/_/busybox
  # https://hub.docker.com/_/eclipse-mosquitto
  # https://github.com/linuxserver/docker-code-server
  # https://github.com/home-assistant/core
  - ./transformers/images.yaml
  - ./transformers/labels.yaml
  - ./transformers/replicas.yaml
