---
apiVersion: builtin
kind: ReplicaCountTransformer
metadata:
  name: mqtt-replicatransformer
replica:
  name: mqtt
  count: 1
fieldSpecs:
  - path: spec/replicas
    create: false
    kind: Deployment
  - path: spec/replicas
    create: false
    kind: ReplicationController
  - path: spec/replicas
    create: false
    kind: ReplicaSet
  - path: spec/replicas
    create: true
    kind: StatefulSet
