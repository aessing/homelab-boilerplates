# Enable file descriptor and stat cache for local files
open_file_cache          max=1000 inactive=20s;
open_file_cache_valid    30s;
open_file_cache_min_uses 2;
open_file_cache_errors   on;

server {
    listen 8080;
    root /usr/share/nginx/html/assets;

    # Only the exporter sidecar can read this endpoint through the shared Pod
    # network namespace. It is not reachable through the Service or Ingress.
    location = /stub_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }

    location / {
        autoindex on;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
