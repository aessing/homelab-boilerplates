---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: homepage

buildMetadata:
  - managedByLabel
  - originAnnotations
  # - transformerAnnotations

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/version: v2.1.2  # The current version of the application

resources:
  - ../../base

generators:
  - ./generators/config.yaml

patches:
  - path: ./patches/certificate.yaml
    target:
      group: cert-manager.io
      version: v1
      kind: Certificate
  - path: ./patches/deployment-env.yaml  # See gethomepage.dev/installation/#homepage_allowed_hosts
    target:
      group: apps
      version: v1
      kind: Deployment
  - path: ./patches/ingressroute.yaml
    target:
      group: traefik.io
      version: v1alpha1
      kind: IngressRoute
  - path: ./patches/resource-quota.yaml
    target:
      version: v1
      kind: ResourceQuota

transformers:
  # https://github.com/gethomepage/homepage
  - ./transformers/images.yaml
  - ./transformers/labels.yaml
  - ./transformers/replicas.yaml
