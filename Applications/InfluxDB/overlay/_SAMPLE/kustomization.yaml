apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: influxdb

buildMetadata:
  - managedByLabel
  - originAnnotations
  - transformerAnnotations

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/version: '2.7.11'
  - includeSelectors: true
    pairs:
      app.kubernetes.io/instance: 'influxdb'

resources:
  - ../../base

patches:
  - path: ./patches/certificate.json
    target:
      group: cert-manager.io
      version: v1
      kind: Certificate
  - path: ./patches/ingressroute.json
    target:
      group: traefik.io
      version: v1alpha1
      kind: IngressRoute
  - path: ./patches/resource-quota.json
    target:
      version: v1
      kind: ResourceQuota

transformers:
  # https://github.com/influxdata/influxdb
  - ./transformers/images.yaml
  - ./transformers/replicas.yaml
