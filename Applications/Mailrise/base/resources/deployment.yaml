---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailrise
  labels:
    app.kubernetes.io/component: 'application' # The component within the architecture
  annotations:
    #reloader.stakater.com/auto: 'true' # Reloads workload when any referenced ConfigMap or Secret changes
    reloader.stakater.com/search: 'true' # Enables search mode (only reloads if matching secrets/configMaps are found)
    #configmap.reloader.stakater.com/auto: 'true' # Reloads only when referenced ConfigMap(s) change
    #configmap.reloader.stakater.com/reload: '' # Reloads when specific ConfigMap(s) change, regardless of how they're used
    #secret.reloader.stakater.com/auto: 'true' # Reloads only when referenced Secret(s) change
    #secret.reloader.stakater.com/reload: '' # Reloads when specific Secret(s) change, regardless of how they're used
    reloader.stakater.com/rollout-strategy: 'rollout' # Specifies the rollout strategy for the workload (rollout (default) / restart)
spec:
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/component: 'application' # The component within the architecture
    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: 180
      securityContext:
        fsGroup: 999
      containers:
        - name: mailrise
          image: ghcr.io/yoryan/mailrise:0.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: true
          resources:
            requests:
              memory: 32Mi
              cpu: 0.02
            limits:
              memory: 64Mi
              cpu: 0.25
          ports:
            - containerPort: 465
              protocol: TCP
              name: mailsecure
          envFrom:
            - secretRef:
                name: mailrise-services
            - secretRef:
                name: mailrise-users
          volumeMounts:
            - name: mailrise-config-vol
              mountPath: /etc/mailrise.conf
              subPath: mailrise.conf
              readOnly: true
            - name: mailrise-certificate-vol
              mountPath: /etc/mailrise/cert
              readOnly: true
      volumes:
        - name: mailrise-config-vol
          configMap:
            name: mailrise-config
        - name: mailrise-certificate-vol
          secret:
            secretName: mailrise-certificate
