---
apiVersion: v1
kind: Service
metadata:
  name: mailrise
  labels:
    app.kubernetes.io/component: 'application' # The component within the architecture
  annotations:
    metallb.io/loadBalancerIPs: '0.0.0.0'
spec:
  selector:
    app.kubernetes.io/component: 'application' # The component within the architecture
  ports:
    - protocol: TCP
      port: 465
      targetPort: 465
      name: mailsecure
  type: LoadBalancer
