apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mailrise

buildMetadata:
  - managedByLabel
  - originAnnotations
  #- transformerAnnotations

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/version: latest # The current version of the application

resources:
  - ../../base

generators:
  - ./generators/secret-mailrise-services.yaml
  - ./generators/secret-mailrise-users.yaml

patches:
  - path: ./patches/certificate.json
    target:
      group: cert-manager.io
      version: v1
      kind: Certificate
  - path: ./patches/resource-quota.json
    target:
      version: v1
      kind: ResourceQuota
  - path: ./patches/service.json
    target:
      version: v1
      kind: Service

transformers:
  # https://github.com/YoRyan/mailrise
  - ./transformers/images.yaml
  - ./transformers/labels.yaml
  - ./transformers/replicas.yaml

components:
  - ../../components/internal
