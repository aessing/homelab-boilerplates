---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alloy-logs-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: alloy-logs
  policyTypes:
    - Egress
  egress:
    # Overlays replace the documentation addresses with exact cluster endpoints.
    - to:
        - ipBlock:
            cidr: 192.0.2.1/32
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 192.0.2.11/32
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 192.0.2.11/32
      ports:
        - protocol: TCP
          port: 6443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
