---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  labels:
    app.kubernetes.io/component: kube-state-metrics
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: kube-state-metrics
  ports:
    - name: metrics
      protocol: TCP
      port: 8080
      targetPort: metrics
    - name: telemetry
      protocol: TCP
      port: 8081
      targetPort: telemetry
