apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: alloy-metrics
spec:
  template:
    spec:
      containers:
        - name: alloy-metrics
          env:
            - name: LOKI_WRITE_URL
              valueFrom:
                configMapKeyRef:
                  name: alloy-logs-environment
                  key: LOKI_WRITE_URL
          volumeMounts:
            - name: logs-token
              mountPath: /var/run/secrets/monitoring-agent-logs
              readOnly: true
      volumes:
        - name: logs-token
          secret:
            secretName: monitoring-agent-logs
            items:
              - key: token
                path: token
