---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  labels:
    app.kubernetes.io/component: node-exporter
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/component: node-exporter
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/component: node-exporter
    spec:
      automountServiceAccountToken: false
      hostPID: true
      # Netlink collectors must read the host network namespace.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/os: linux
      terminationGracePeriodSeconds: 30
      tolerations:
        - operator: Exists
      containers:
        - name: node-exporter
          image: quay.io/prometheus/node-exporter:0.0.0
          imagePullPolicy: IfNotPresent
          args:
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --path.rootfs=/host/root
            - --web.listen-address=$(HOST_IP):9100
            - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/kubelet/pods/.+|var/lib/containers/storage/.+)($|/)
            - --collector.systemd
            - --collector.systemd.unit-include=^(k3s|sshd|systemd-timesyncd|ufw|unattended-upgrades|cron|auditd)\.service$
            - --collector.textfile.directory=/var/lib/node_exporter/textfile_collector
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          securityContext:
            # systemd's read-only D-Bus API requires UID 0 on hardened Ubuntu hosts.
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: '0'
              memory: '0'
            limits:
              cpu: 100m
              memory: 64Mi
          ports:
            - name: metrics
              containerPort: 9100
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: root
              mountPath: /host/root
              readOnly: true
              mountPropagation: HostToContainer
            - name: textfile-collector
              mountPath: /var/lib/node_exporter/textfile_collector
              readOnly: true
            - name: systemd-private
              mountPath: /run/systemd/private
              readOnly: true
        - name: maintenance-collector
          image: busybox:1.37.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/collect-maintenance-metrics.sh"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: '0'
              memory: '0'
            limits:
              cpu: 20m
              memory: 32Mi
          volumeMounts:
            - name: root
              mountPath: /host
              readOnly: true
              mountPropagation: HostToContainer
            - name: textfile-collector
              mountPath: /var/lib/node_exporter/textfile_collector
            - name: maintenance-collector-script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: proc
          hostPath:
            path: /proc
            type: Directory
        - name: sys
          hostPath:
            path: /sys
            type: Directory
        - name: root
          hostPath:
            path: /
            type: Directory
        - name: systemd-private
          hostPath:
            path: /run/systemd/private
            type: Socket
        - name: textfile-collector
          emptyDir:
            medium: Memory
        - name: maintenance-collector-script
          configMap:
            name: node-maintenance-collector
            defaultMode: 0444
