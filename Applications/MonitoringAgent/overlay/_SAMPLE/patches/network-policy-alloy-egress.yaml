---
- op: replace
  path: /spec/egress/0/to
  value:
    - ipBlock:
        cidr: 192.0.2.1/32

- op: replace
  path: /spec/egress/1/to
  value:
    - ipBlock:
        cidr: 192.0.2.11/32
    - ipBlock:
        cidr: 192.0.2.12/32
    - ipBlock:
        cidr: 192.0.2.13/32

- op: replace
  path: /spec/egress/2/to
  value:
    - ipBlock:
        cidr: 192.0.2.11/32
    - ipBlock:
        cidr: 192.0.2.12/32
    - ipBlock:
        cidr: 192.0.2.13/32

- op: replace
  path: /spec/egress/3/to
  value:
    - ipBlock:
        cidr: 192.0.2.100/32

# In-cluster HTTPS is evaluated after Service DNAT by some CNIs.
- op: add
  path: /spec/egress/-
  value:
    to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: traefik-system
        podSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
    ports:
      - protocol: TCP
        port: 8443
