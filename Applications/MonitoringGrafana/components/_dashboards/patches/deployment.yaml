---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  template:
    spec:
      containers:
        - name: grafana
          volumeMounts:
            - name: monitoring-dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards/monitoring.yaml
              subPath: monitoring.yaml
              readOnly: true
            - name: monitoring-dashboards
              mountPath: /var/lib/grafana/monitoring-dashboards
              readOnly: true
            - name: monitoring-log-dashboards
              mountPath: /var/lib/grafana/monitoring-log-dashboards
              readOnly: true
      volumes:
        - name: monitoring-log-dashboards
          configMap:
            name: grafana-monitoring-dashboards-logs
        - name: monitoring-dashboard-provider
          configMap:
            name: grafana-monitoring-dashboard-provider
        - name: monitoring-dashboards
          projected:
            sources:
              - configMap:
                  name: grafana-monitoring-dashboards-core
              - configMap:
                  name: grafana-monitoring-dashboards-platform
              - configMap:
                  name: grafana-monitoring-dashboards-operations
