---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

configMapGenerator:
  - name: loki-config
    behavior: create
    options:
      labels:
        app.kubernetes.io/component: application
      annotations:
        reloader.stakater.com/match: 'false'
    files:
      - loki.yaml=./configs/loki.yaml

resources:
  - ./resources/service.yaml
  - ./resources/statefulset.yaml
