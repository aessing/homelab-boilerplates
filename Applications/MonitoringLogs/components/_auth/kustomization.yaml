---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

configMapGenerator:
  - name: vmauth-config
    behavior: create
    options:
      labels:
        app.kubernetes.io/component: auth
      annotations:
        reloader.stakater.com/match: 'false'
    files:
      - auth.yml=./configs/auth.yml

resources:
  - ./resources/deployment.yaml
  - ./resources/service.yaml
