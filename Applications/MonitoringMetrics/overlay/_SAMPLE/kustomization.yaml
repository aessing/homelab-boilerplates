---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring-metrics

buildMetadata:
  - managedByLabel
  - originAnnotations

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/version: 1.152.0

resources:
  - ../../base

generators:
  - ./generators/config-vmauth.yaml
  - ./generators/secret-monitoring-metrics-auth.yaml

patches:
  - path: ./patches/certificate.yaml
    target:
      group: cert-manager.io
      version: v1
      kind: Certificate
      name: monitoring-metrics
  - path: ./patches/ingressroute-write.yaml
    target:
      group: traefik.io
      version: v1alpha1
      kind: IngressRoute
      name: monitoring-metrics-write
  - path: ./patches/ingressroute-query.yaml
    target:
      group: traefik.io
      version: v1alpha1
      kind: IngressRoute
      name: monitoring-metrics-query
  - path: ./patches/pvc.yaml
    target:
      group: apps
      version: v1
      kind: StatefulSet
      name: victoriametrics
  - path: ./patches/resource-quota.yaml
    target:
      version: v1
      kind: ResourceQuota
      name: monitoring-metrics

transformers:
  - ./transformers/images.yaml
  - ./transformers/labels.yaml
  - ./transformers/replicas.yaml
