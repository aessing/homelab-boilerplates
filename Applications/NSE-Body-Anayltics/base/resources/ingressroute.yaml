---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nse-body-analytics
  labels:
    app.kubernetes.io/component: 'application'
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: CHANGE_ME
      kind: Rule
      middlewares:
        - name: chain-default
          namespace: traefik-system
      services:
        - name: nse-body-analytics
          port: 4173
          passHostHeader: true
          sticky:
            cookie:
              httpOnly: true
              secure: true
              sameSite: none
  tls:
    secretName: nse-body-analytics-certificate
