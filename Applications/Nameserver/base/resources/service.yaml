---
apiVersion: v1
kind: Service
metadata:
  name: nameserver
  annotations:
    metallb.universe.tf/loadBalancerIPs: '0.0.0.0'
spec:
  ports:
    - protocol: TCP
      port: 53
      targetPort: 53
      name: dns-tcp
    - protocol: UDP
      port: 53
      targetPort: 53
      name: dns-udp
    - protocol: TCP
      port: 443
      targetPort: 443
      name: https
    - protocol: TCP
      port: 853
      targetPort: 853
      name: dns-dot
  type: LoadBalancer
