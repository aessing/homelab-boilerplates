apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nameserver

buildMetadata:
  - managedByLabel
  - originAnnotations
  - transformerAnnotations

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/version: '1.3.5'
  - includeSelectors: true
    pairs:
      app.kubernetes.io/instance: 'bind-internal'

resources:
  - ../../base

patches:
  - path: ./patches/certificate.json
    target:
      group: cert-manager.io
      version: v1
      kind: Certificate
  - path: ./patches/resource-quota.json
    target:
      version: v1
      kind: ResourceQuota
  - path: ./patches/service.json
    target:
      version: v1
      kind: Service

transformers:
  # https://github.com/aessing/bind-container
  - ./transformers/images.yaml
  - ./transformers/replicas.yaml

components:
  - ../../components/_SAMPLE/config
  - ../../components/_SAMPLE/zones
