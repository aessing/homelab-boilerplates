---
apiVersion: builtin
kind: ReplicaCountTransformer
metadata:
  name: nameserver-replicatransformer
replica:
  name: nameserver
  count: ###NUMBER_OF_REPLICAS###
fieldSpecs:
  - path: spec/replicas
    create: true
    kind: Deployment
  - path: spec/replicas
    create: false
    kind: ReplicationController
  - path: spec/replicas
    create: false
    kind: ReplicaSet
  - path: spec/replicas
    create: false
    kind: StatefulSet
