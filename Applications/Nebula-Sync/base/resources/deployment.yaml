---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nebula-sync
  labels:
    app.kubernetes.io/component: 'application'
  annotations:
    #reloader.stakater.com/auto: 'true' # Reloads workload when any referenced ConfigMap or Secret changes
    reloader.stakater.com/search: 'false' # Enables search mode (only reloads if matching secrets/configMaps are found)
    #configmap.reloader.stakater.com/auto: 'true' # Reloads only when referenced ConfigMap(s) change
    #configmap.reloader.stakater.com/reload: '' # Reloads when specific ConfigMap(s) change, regardless of how they're used
    #secret.reloader.stakater.com/auto: 'true' # Reloads only when referenced Secret(s) change
    #secret.reloader.stakater.com/reload: '' # Reloads when specific Secret(s) change, regardless of how they're used
    reloader.stakater.com/rollout-strategy: 'rollout' # Specifies the rollout strategy for the workload (rollout (default) / restart)
spec:
  revisionHistoryLimit: 3
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/component: 'application' # The component within the architecture
    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1001
      containers:
        - name: nebula-sync
          image: ghcr.io/lovelaze/nebula-sync:0.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            runAsUser: 1001
            runAsGroup: 1001
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 0.05
              memory: 64Mi
            limits:
              cpu: 0.2
              memory: 128Mi
          env:
            - name: PRIMARY_FILE
              value: '/run/secrets/primary'
            - name: REPLICAS_FILE
              value: '/run/secrets/replicas'
          volumeMounts:
            - name: nebula-sync-replicas
              mountPath: /run/secrets/primary
              subPath: primary
              readOnly: true
            - name: nebula-sync-replicas
              mountPath: /run/secrets/replicas
              subPath: replicas
              readOnly: true
      volumes:
        - name: nebula-sync-replicas
          secret:
            secretName: nebula-sync-replicas
