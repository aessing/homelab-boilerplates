apiVersion: apps/v1
kind: Deployment
metadata:
  name: nebula-sync
spec:
  template:
    spec:
      containers:
        - name: nebula-sync
          env:
            - name: FULL_SYNC
              value: 'true'
            - name: CRON
              value: '*/15 * * * *'
            - name: RUN_GRAVITY
              value: 'true'
            - name: CLIENT_SKIP_TLS_VERIFICATION
              value: 'false'
            - name: CLIENT_RETRY_DELAY_SECONDS
              value: '15'
            - name: CLIENT_TIMEOUT_SECONDS
              value: '45'
            # - name: SYNC_CONFIG_DNS
            #   value: 'true'
            # - name: SYNC_CONFIG_DHCP
            #   value: 'true'
            # - name: SYNC_CONFIG_NTP
            #   value: 'true'
