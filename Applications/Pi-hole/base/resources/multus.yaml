---
apiVersion: 'k8s.cni.cncf.io/v1'
kind: NetworkAttachmentDefinition
metadata:
  name: pihole
  labels:
    app.kubernetes.io/component: 'application'
spec:
  config: {
    "cniVersion": "0.3.1",
    "type": "ipvlan",
    "master": "###INTERFACE_NAME###",
    "mode": "l2",
    "ipam": {
      "type": "static",
      "addresses": [
        {
          "address": "###IP_ADDRESS_FOR_CONTAINER###/###CIDR###",
          "gateway": "###GATEWAY_IP_ADDRESS###"
        }
      ],
      "routes": [
        {"dst": "###SUBNET_FOR_ROUTING###/###CIDR###"},
        {"dst": "###SUBNET_FOR_ROUTING###/###CIDR###"},
        {"dst": "###SUBNET_FOR_ROUTING###/###CIDR###"}
      ]
    }
  }
