---
apiVersion: builtin
kind: SecretGenerator
metadata:
  name: postgres-database-objectstore
behavior: create
options:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/component: 'database'
    cnpg.io/reload: 'true'
  annotations:
    reloader.stakater.com/match: 'false'
    reloader.stakater.com/ignore: 'true'
type: Opaque
envs:
  - ./secrets/secret-objectstore.env
