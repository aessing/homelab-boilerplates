---
# Network policy for client access to PostgreSQL database
# Allows connections from defined sources
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clients-to-database
spec:
  ingress:
    - from:
        - ipBlock:
            cidr: 10.0.0.0/8
        - ipBlock:
            cidr: 172.16.0.0/12
        - ipBlock:
            cidr: 192.168.0.0/16
