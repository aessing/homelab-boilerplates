apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./resources/certificate.yaml
  - ./resources/ingressroute.yaml
  - ./resources/multus.yaml
  - ./resources/namespace.yaml
  - ./resources/network-policy.yaml
  - ./resources/resource-quota.yaml
  - ./resources/service.yaml
  - ./resources/statefulset.yaml

configMapGenerator:
  - name: scrypted-scripts
    behavior: create
    options:
      labels:
        app.kubernetes.io/component: 'application' # The component within the architecture
      annotations:
        # Reloads handled by kustomize with suffix
        reloader.stakater.com/match: 'false' # Marks the config/secret as eligible for reload in search mode
    files:
      - ./configs/convertCerts.sh
