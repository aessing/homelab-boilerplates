spec:
  config: '{
    "cniVersion": "0.3.1",
    "type": "ipvlan",
    "master": "CHANGE_ME",
    "mode": "l2",
    "ipam": {
      "type": "static",
      "addresses": [
        {
          "address": "0.0.0.0/0",
          "gateway": "0.0.0.0"
        }
      ],
      "routes": [
        { "dst": "0.0.0.0/02" },
        { "dst": "0.0.0.0/0" }
		  ]
    }
  }'