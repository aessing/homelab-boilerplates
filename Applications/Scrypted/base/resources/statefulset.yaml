---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: scrypted
  labels:
    app.kubernetes.io/component: 'application'
  annotations:
    #reloader.stakater.com/auto: 'true' # Reloads workload when any referenced ConfigMap or Secret changes
    reloader.stakater.com/search: 'true' # Enables search mode (only reloads if matching secrets/configMaps are found)
    #configmap.reloader.stakater.com/auto: 'true' # Reloads only when referenced ConfigMap(s) change
    #configmap.reloader.stakater.com/reload: '' # Reloads when specific ConfigMap(s) change, regardless of how they're used
    #secret.reloader.stakater.com/auto: 'true' # Reloads only when referenced Secret(s) change
    #secret.reloader.stakater.com/reload: '' # Reloads when specific Secret(s) change, regardless of how they're used
    reloader.stakater.com/rollout-strategy: 'rollout' # Specifies the rollout strategy for the workload (rollout (default) / restart)
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: 'application'
  serviceName: scrypted
  replicas: 0
  persistentVolumeClaimRetentionPolicy:
    whenScaled: Retain
    whenDeleted: Retain
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/component: 'application'
      annotations:
        k8s.v1.cni.cncf.io/networks: scrypted/scrypted
    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: 180
      initContainers:
        - name: scrypted-init
          image: busybox:0.0.0
          command: ['/bin/sh', '-c', '/convertCerts.sh']
          volumeMounts:
            - name: scrypted-pvc
              mountPath: '/server/volume'
              readOnly: false
            - name: scrypted-ssl-vol
              mountPath: /tls.key
              subPath: tls.key
              readOnly: true
            - name: scrypted-ssl-vol
              mountPath: /tls.crt
              subPath: tls.crt
              readOnly: true
            - name: scrypted-scripts-vol
              mountPath: /convertCerts.sh
              subPath: convertCerts.sh
              readOnly: true
      containers:
        - name: scrypted
          image: ghcr.io/koush/scrypted:v0.0.0-xxx-full
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 0.5
              memory: 1Gi
            limits:
              cpu: 2
              memory: 2Gi
          env:
            - name: SCRYPTED_INSECURE_PORT
              value: '10080'
            - name: SCRYPTED_SECURE_PORT
              value: '10443'
            - name: SCRYPTED_DOCKER_AVAHI
              value: 'false'
            - name: SCRYPTED_HTTPS_OPTIONS_FILE
              value: /server/volume/cert.json
          ports:
            - containerPort: 10080
              protocol: TCP
              name: http
            - containerPort: 10443
              protocol: TCP
              name: https
          startupProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 5
          volumeMounts:
            - name: scrypted-pvc
              mountPath: '/server/volume'
      volumes:
        - name: scrypted-ssl-vol
          secret:
            secretName: scrypted-certificate
            defaultMode: 0440
        - name: scrypted-scripts-vol
          configMap:
            name: scrypted-scripts
            defaultMode: 0550
  volumeClaimTemplates:
    - metadata:
        name: scrypted-pvc
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn-retain
        resources:
          requests:
            storage: 0Gi
