---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: scrypted
spec:
  template:
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - '###PREFERRED_NODE_HOSTNAME###'
