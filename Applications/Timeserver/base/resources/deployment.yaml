---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: timeserver
  annotations:
    configmap.reloader.stakater.com/reload: ''
    secret.reloader.stakater.com/reload: ''
spec:
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 101
      initContainers:
        - name: fix-perms
          image: busybox:0.0.0
          command: ['sh', '-c', 'chown -R 100:101 /run/chrony /var/lib/chrony && chmod 700 /run/chrony /var/lib/chrony']
          volumeMounts:
            - name: chrony-drift
              mountPath: /var/lib/chrony
            - name: chrony-run
              mountPath: /run/chrony
      containers:
        - name: chrony
          image: ghcr.io/aessing/chronyd:0.0.0
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: 8Mi
              cpu: 0.01
            limits:
              memory: 16Mi
              cpu: 0.25
          ports:
            - containerPort: 123
              protocol: UDP
              name: ntp
          startupProbe:
            exec:
              command: ['/usr/bin/chronyc', 'tracking']
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ['/usr/bin/chronyc', 'tracking']
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ['/usr/bin/chronyc', 'tracking']
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 5
          volumeMounts:
            - name: chrony-config
              mountPath: /etc/chrony/chrony.conf
              subPath: chrony.conf
              readOnly: true
            - name: chrony-drift
              mountPath: /var/lib/chrony
            - name: chrony-run
              mountPath: /run/chrony
      volumes:
        - name: chrony-config
          configMap:
            name: timeserver-config
        - name: chrony-drift
          emptyDir: {}
        - name: chrony-run
          emptyDir: {}
