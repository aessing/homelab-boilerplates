apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: timeserver

buildMetadata:
  - managedByLabel
  - originAnnotations
  #- transformerAnnotations

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/version: 1.4.3 # The current version of the application

resources:
  - ../../base

patches:
  - path: ./patches/resource-quota.json
    target:
      version: v1
      kind: ResourceQuota
  - path: ./patches/service.json
    target:
      version: v1
      kind: Service

transformers:
  # https://github.com/aessing/chronyd-container
  - ./transformers/images.yaml
  - ./transformers/labels.yaml
  - ./transformers/replicas.yaml

components:
  - ../../components/config
