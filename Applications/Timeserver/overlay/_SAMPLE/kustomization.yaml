apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: timeserver

buildMetadata:
  - managedByLabel
  - originAnnotations
  - transformerAnnotations

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/version: '1.3.5'
  - includeSelectors: true
    pairs:
      app.kubernetes.io/instance: 'chrony-internal'

resources:
  - ../../base

patches:
  - path: ./patches/resource-quota.json
    target:
      version: v1
      kind: ResourceQuota
  - path: ./patches/service.json
    target:
      version: v1
      kind: Service

transformers:
  # https://github.com/aessing/chronyd-container
  - ./transformers/images.yaml
  - ./transformers/replicas.yaml
