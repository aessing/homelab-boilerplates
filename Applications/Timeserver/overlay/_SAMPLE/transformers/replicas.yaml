---
apiVersion: builtin
kind: ReplicaCountTransformer
metadata:
  name: timeserver-replicatransformer
replica:
  name: timeserver
  count: 3
fieldSpecs:
  - path: spec/replicas
    create: true
    kind: Deployment
  - path: spec/replicas
    create: true
    kind: ReplicationController
  - path: spec/replicas
    create: true
    kind: ReplicaSet
  - path: spec/replicas
    create: true
    kind: StatefulSet
