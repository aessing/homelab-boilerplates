---
apiVersion: builtin
kind: ReplicaCountTransformer
metadata:
  name: unbound-replicatransformer
replica:
  name: unbound
  count: 2
fieldSpecs:
  - path: spec/replicas
    create: true
    kind: Deployment
  - path: spec/replicas
    create: true
    kind: ReplicationController
  - path: spec/replicas
    create: true
    kind: ReplicaSet
  - path: spec/replicas
    create: true
    kind: StatefulSet
