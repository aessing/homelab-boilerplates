---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: alloy-unpoller
  labels:
    app.kubernetes.io/component: collector
spec:
  serviceName: alloy-unpoller
  replicas: 0
  revisionHistoryLimit: 3
  persistentVolumeClaimRetentionPolicy:
    whenScaled: Retain
    whenDeleted: Retain
  selector:
    matchLabels:
      app.kubernetes.io/component: collector
  template:
    metadata:
      labels:
        app.kubernetes.io/component: collector
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alloy-unpoller
          image: grafana/alloy:0.0.0
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --stability.level=experimental
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data
            - /etc/alloy/config
          envFrom:
            - configMapRef:
                name: alloy-unpoller-environment
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          ports:
            - name: http
              containerPort: 12345
              protocol: TCP
            - name: syslog-udp
              containerPort: 1514
              protocol: UDP
            - name: syslog-tcp
              containerPort: 1514
              protocol: TCP
            - name: loki-push
              containerPort: 1515
              protocol: TCP
          startupProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/alloy/config
              readOnly: true
            - name: credentials
              mountPath: /var/run/secrets/alloy-unpoller
              readOnly: true
            - name: data
              mountPath: /var/lib/alloy
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: alloy-unpoller-config
        - name: credentials
          secret:
            secretName: alloy-unpoller-writers
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
