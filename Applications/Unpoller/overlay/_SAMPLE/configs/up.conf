[poller]
  debug = false
  quiet = false

[prometheus]
  disable = false
  http_listen = "0.0.0.0:9130"
  report_errors = true
  dead_ports = true
  interval = "60s"

[influxdb]
  disable = true

[loki]
  disable = false
  url = "http://alloy-unpoller:1515/loki/api/v1/push"
  verify_ssl = false
  interval = "60s"
  timeout = "10s"

[webserver]
  enable = false

[unifi]
  dynamic = false

[unifi.defaults]
  url = "https://192.0.2.10"
  user = "unpoller"
  pass = "file:///var/run/secrets/unpoller/network_password"
  protect_api_key = "file:///var/run/secrets/unpoller/protect_api_key"
  sites = ["all"]
  timeout = "60s"
  save_sites = true
  hash_pii = false
  save_ids = true
  save_events = true
  save_syslog = true
  save_alarms = true
  save_anomalies = true
  save_protect_logs = true
  protect_thumbnails = false
  save_protect_devices = true
  disable_network = false
  save_dpi = true
  save_traffic = true
  save_rogue = true
  save_speedtest = true
  verify_ssl = true

# Use separate clients for Network and Protect. A key-only Protect client avoids
# mixing the Network login session with Protect Integration API authentication.
[[unifi.controller]]
  url = "https://192.0.2.10"
  save_protect_logs = false
  save_protect_devices = false
  disable_network = false

[[unifi.controller]]
  url = "https://192.0.2.10"
  protect_api_key = "file:///var/run/secrets/unpoller/protect_api_key"
  save_sites = false
  save_ids = false
  save_events = false
  save_syslog = false
  save_alarms = false
  save_anomalies = false
  save_protect_logs = false
  save_protect_devices = true
  disable_network = true
  save_dpi = false
  save_traffic = false
  save_rogue = false
  save_speedtest = false

[unas]
  enable = true

[unas.defaults]
  user = "unpoller"
  verify_ssl = true
  timeout = "60s"

[[unas.device]]
  url = "https://192.0.2.20"
