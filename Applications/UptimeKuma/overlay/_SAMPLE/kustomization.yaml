---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: uptimekuma

buildMetadata:
  - managedByLabel
  - originAnnotations
  # - transformerAnnotations

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/version: 2.1.1-rootless  # The current version of the application

resources:
  - ../../base

generators:
  - ./generators/secret-uptimekuma-database-root.yaml
  - ./generators/secret-uptimekuma-database-user.yaml

patches:
  - path: ./patches/certificate.yaml
    target:
      group: cert-manager.io
      version: v1
      kind: Certificate
  - path: ./patches/ingressroute.yaml
    target:
      group: traefik.io
      version: v1alpha1
      kind: IngressRoute
  - path: ./patches/pvc-application.yaml
    target:
      group: apps
      version: v1
      kind: StatefulSet
      name: uptimekuma
  - path: ./patches/pvc-database.yaml
    target:
      group: apps
      version: v1
      kind: StatefulSet
      name: uptimekuma-database
  - path: ./patches/resource-quota.yaml
    target:
      version: v1
      kind: ResourceQuota

transformers:
  # https://github.com/louislam/uptime-kuma
  # https://hub.docker.com/_/mariadb
  - ./transformers/images.yaml
  - ./transformers/labels.yaml
  - ./transformers/replicas.yaml
