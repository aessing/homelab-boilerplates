---
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: metallb
spec:
  valuesContent: |-
    rbac:
      create: true
    speaker:
      frr:
        enabled: false
    frrk8s:
      enabled: false
    frr-k8s:
      prometheus:
        serviceMonitor:
          enabled: false
    crds:
      enabled: true
      validationFailurePolicy: Fail
