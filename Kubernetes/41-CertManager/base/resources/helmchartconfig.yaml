---
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: cert-manager
spec:
  valuesContent: |-
    installCRDs: true
    replicaCount: 1
    dns01RecursiveNameservers: '9.9.9.9:53,1.1.1.2:53'
    dns01RecursiveNameserversOnly: true
    podDnsPolicy: 'None'
    podDnsConfig:
      nameservers:
        - '9.9.9.9'
        - '1.1.1.2'
