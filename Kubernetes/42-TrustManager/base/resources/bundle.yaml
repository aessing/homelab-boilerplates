---
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: trust-manager-ca
spec:
  sources:
    - useDefaultCAs: true
  target:
    secret:
      key: "ca.crt"
      metadata:
        labels:
          app.kubernetes.io/component: "trust-bundle"
    namespaceSelector:
      matchLabels:
        workspace.trust.cert-manager.io/trust-manager-ca: "true"
