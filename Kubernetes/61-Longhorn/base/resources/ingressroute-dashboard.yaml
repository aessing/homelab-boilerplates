---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: longhorn-dashboard
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    # Authentik callback path - HIGHEST priority
    - kind: Rule
      match: "Host(`CHANGE_ME`) && PathPrefix(`/outpost.goauthentik.io/`)"
      priority: 15
      services:
        - kind: Service
          name: CHANGE_ME
          namespace: authentik-outpost
          port: 9000
    # Main application (including /api/*) - WITH authentication
    - kind: Rule
      match: "Host(`CHANGE_ME`)"
      middlewares:
        - name: chain-admin
          namespace: traefik-system
        - name: CHANGE_ME
          namespace: authentik-outpost
      priority: 10
      services:
        - name: longhorn-frontend
          port: 80
          passHostHeader: true
          # sticky:
          #   cookie:
          #     httpOnly: true
          #     secure: true
          #     sameSite: none
  tls:
    secretName: longhorn-dashboard-certificate
