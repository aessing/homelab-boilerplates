---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nameserver

buildMetadata:
  - managedByLabel
  - originAnnotations
  # - transformerAnnotations

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/version: 1.4.7  # The current version of the application

resources:
  - ../../base

patches:
  - path: ./patches/certificate.yaml
    target:
      group: cert-manager.io
      version: v1
      kind: Certificate
  - path: ./patches/resource-quota.yaml
    target:
      version: v1
      kind: ResourceQuota
  - path: ./patches/service.yaml
    target:
      version: v1
      kind: Service

transformers:
  # https://github.com/aessing/bind-container
  - ./transformers/images.yaml
  - ./transformers/labels.yaml
  - ./transformers/replicas.yaml

components:
  - ../../components/internal/config
  - ../../components/internal/zones
